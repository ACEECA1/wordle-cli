name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_path: wordle-linux-x64.tar.gz
          - os: windows-latest
            asset_path: wordle-windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libcurl4-openssl-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build project
      run: cmake --build build --config Release

    - name: Package artifacts (Linux)
      if: runner.os == 'Linux'
      run: |
        tar -czvf wordle-linux-x64.tar.gz -C build wordle

    - name: Package artifacts (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release-pkg
        Copy-Item -Path "build\Release\wordle.exe" -Destination "release-pkg\wordle.exe"
        Copy-Item -Path "install.bat" -Destination "release-pkg\install.bat"
        Compress-Archive -Path "release-pkg\*" -DestinationPath "wordle-windows-x64.zip"

    - name: Upload binaries to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        files: ${{ matrix.asset_path }}
        generate_release_notes: true
